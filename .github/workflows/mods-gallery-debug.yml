name: Mods gallery debug (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GG_CRIMSON_QA_DISPOSABLE: 'YES'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r build-requirements.txt -r ui-preview-requirements.txt
      - name: Probe
        run: python tools/mods_gallery_probe.py
