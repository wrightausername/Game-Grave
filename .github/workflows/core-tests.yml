name: Core safety tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "cryptography>=44,<47"
      - name: Prepare test fixtures outside protected AppData on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE "_ci_temp"
          New-Item -ItemType Directory -Force $testTemp | Out-Null
          "TMPDIR=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run unit tests (no game file deletion)
        run: python -m unittest discover -s tests -v
