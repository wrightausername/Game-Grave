concurrency:
  group: crimson-command-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to publish review screenshots to claude/old-files-screenshots, claude/other-storage-screenshots, claude/captures-screenshots, claude/graveyard-screenshots, claude/dna-screenshots, claude/undo-screenshots, claude/assistant-screenshots, claude/settings-screenshots and claude/tools-screenshots

jobs:
  desktop:
    name: Render and package Crimson Command on Windows
    runs-on: windows-latest
    env:
      GG_CRIMSON_QA_DISPOSABLE: 'YES'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview and packaging dependencies
        run: python -m pip install -r build-requirements.txt -r ui-preview-requirements.txt
      - name: Create isolated temp folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '_ci_temp' | Out-Null
          $p = (Resolve-Path '_ci_temp').Path
          "TEMP=$p" | Out-File $env:GITHUB_ENV -Append
          "TMP=$p" | Out-File $env:GITHUB_ENV -Append
      - name: Compile new Python modules
        run: python -m compileall -q gg_desktop
      - name: Pure model tests and source UI smoke
        shell: pwsh
        run: |
          python -m unittest tests.test_gg_desktop_models tests.test_ready_room_data tests.test_ready_room_services tests.test_overview_data tests.test_overview_storage tests.test_overview_preferences tests.test_games_functionality tests.test_mods_functionality tests.test_mods_insight tests.test_old_files_functionality tests.test_old_files_insight tests.test_other_storage tests.test_captures tests.test_grave tests.test_dna tests.test_undo tests.test_assistant tests.test_settings tests.test_tools tests.test_ready_room_live tests.test_mods_sort tests.test_winpc tests.test_scan_clock tests.test_mods_words tests.test_mods_visuals tests.test_soulbind tests.test_blackbox -v
          if ($LASTEXITCODE -ne 0) { throw 'Crimson view model safety tests failed.' }
          python tools/windows_crimson_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Crimson native Qt UI smoke failed.' }
          python tools/photo_reference_guard.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Owner photos or protected engines changed.' }
          python tools/photo_ui_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Photo-layout functionality or reference geometry failed.' }
          python tools/ready_room_ui_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Ready Room native scale, navigation or controls failed.' }
          python tools/undo_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Undo Center filters, status, restore, hide or layout failed in native Qt.' }
          python tools/assistant_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'AI Assistant answers, sources, saved chats, hand-offs or layout failed in native Qt.' }
          python tools/settings_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Settings preferences, saves, excluded folders, protection, export/import or layout failed in native Qt.' }
          python tools/tools_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'More Tools tiles, reports, hash checker, health, tasks, log or layout failed in native Qt.' }
          python tools/shell_polish_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Shell polish (HD logo, nav order, optional AI Assistant, scan bar with ETA) failed in native Qt.' }
          python tools/banner_art_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Header pictures do not fill the full width or show a seam in native Qt.' }
          python tools/games_hd_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Games HD launcher marks or cover art failed in native Qt.' }
          python tools/tools_windows_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'The seven Windows tools failed in native Qt.' }
          python tools/mods_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Mods status, tabs, bulk actions or sources failed in native Qt.' }
          python tools/soulbind_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Soulbind panel, apply, undo, share code or Games badge failed.' }
          python tools/blackbox_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Black Box report building, copy, save or empty states failed.' }
          python tools/old_files_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Old Files scan, tabs, filters, folder view or Recycle Bin path failed in native Qt.' }
          python tools/other_storage_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Other Storage scan, categories, tabs, protection or verified Recycle Bin path failed in native Qt.' }
          python tools/captures_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Captures scan, thumbnails, filters, tabs, analysis, protection or verified Recycle Bin path failed in native Qt.' }
          python tools/grave_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Graveyard evidence, filters, leftover scan, protection or verified Recycle Bin path failed in native Qt.' }
          python tools/dna_page_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Game DNA proven locations, Analyze, linking or hand-offs failed in native Qt.' }
          python -m unittest tests.test_games_sources tests.test_games_integrations -v
          if ($LASTEXITCODE -ne 0) { throw 'Mixed-launcher records, artwork or source identity checks failed.' }
          python tools/games_triple_check.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Games mouse, keyboard, artwork or launcher triple-check failed.' }
          python tools/games_browser_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Games embedded sign-in browser rendering or cancellation failed.' }
          python tools/overview_live_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Overview measurements or live controls failed.' }
          python tools/overview_human_walkthrough.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Overview human click-through or dialog readability failed.' }
          python tools/overview_triple_check.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Overview full-control triple-check failed.' }
          python tools/ready_room_live_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Ready Room live news or verified backup checks failed.' }
          python tools/render_reference_previews.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Native photo comparison renders failed.' }
      - name: Publish Old Files screenshots to a review branch
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shots = @(Get-ChildItem _ci_temp -Filter 'old-files-*.png') + @(Get-ChildItem _ci_temp -Filter 'photo-old-files-*.png')
          if (-not $shots) { Write-Host 'No Old Files screenshots to publish.'; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'old-files-shots'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $shots.FullName $dir
          Set-Content -Path (Join-Path $dir 'README.md') -Value "Rendered by Windows CI run $env:GITHUB_RUN_ID from $env:GITHUB_SHA. Review only; not part of the app."
          Push-Location $dir
          git init -q
          git config user.name 'Game Grave CI'
          git config user.email 'ci@users.noreply.github.com'
          git checkout -q -b claude/old-files-screenshots
          git add -A
          git commit -q -m "Old Files screenshots from run $env:GITHUB_RUN_ID"
          git push -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:refs/heads/claude/old-files-screenshots
          Pop-Location
      - name: Publish Other Storage screenshots to a review branch
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
