          Push-Location $dir
          git init -q
          git config user.name 'Game Grave CI'
          git config user.email 'ci@users.noreply.github.com'
          git checkout -q -b claude/captures-screenshots
          git add -A
          git commit -q -m "Captures screenshots from run $env:GITHUB_RUN_ID"
          git push -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:refs/heads/claude/captures-screenshots
          Pop-Location
      - name: Publish Graveyard screenshots to a review branch
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
