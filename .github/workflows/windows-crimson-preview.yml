name: Crimson Command Qt desktop preview (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gg_desktop/**'
      - 'ui-preview-requirements.txt'
      - 'tests/test_gg_desktop_models.py'
      - 'tests/test_ready_room_data.py'
      - 'tests/test_ready_room_services.py'
      - 'tests/test_overview_data.py'
      - 'tests/test_overview_storage.py'
      - 'tools/overview_tab_lock.py'
      - 'tests/test_games_functionality.py'
      - 'tests/test_mods_functionality.py'
      - 'tests/test_old_files_functionality.py'
      - 'tools/old_files_live_smoke.py'
      - 'tools/old_files_scope_smoke.py'
      - 'tools/photo_ui_smoke.py'
      - 'tools/photo_reference_guard.py'
      - 'tools/render_reference_previews.py'
      - 'tools/mods_live_smoke.py'
      - 'tools/mods_scope_smoke.py'
      - 'tools/games_live_smoke.py'
      - 'tools/games_scope_smoke.py'
      - 'tools/overview_live_smoke.py'
      - 'tools/overview_scope_smoke.py'
      - 'tools/ready_room_live_smoke.py'
      - 'tools/ready_room_ui_smoke.py'
      - 'tools/ready_room_scope_smoke.py'
      - 'tools/windows_crimson_ui_smoke.py'
      - '.github/workflows/windows-crimson-preview.yml'
      - 'installer/GameGraveCrimsonPreview.iss'
      - 'installer/Start_Ready_Room_Reference.bat'
      - 'installer/READY_ROOM_BUILD_README.txt'
      - 'installer/OVERVIEW_BUILD_README.txt'
  pull_request:
    branches: [main]
    paths:
      - 'gg_desktop/**'
      - 'ui-preview-requirements.txt'
      - 'tests/test_gg_desktop_models.py'
      - 'tests/test_ready_room_data.py'
      - 'tests/test_ready_room_services.py'
      - 'tests/test_overview_data.py'
      - 'tests/test_overview_storage.py'
      - 'tools/overview_tab_lock.py'
      - 'tests/test_games_functionality.py'
      - 'tests/test_mods_functionality.py'
      - 'tests/test_old_files_functionality.py'
      - 'tools/old_files_live_smoke.py'
      - 'tools/old_files_scope_smoke.py'
      - 'tools/photo_ui_smoke.py'
      - 'tools/photo_reference_guard.py'
      - 'tools/render_reference_previews.py'
      - 'tools/mods_live_smoke.py'
      - 'tools/mods_scope_smoke.py'
      - 'tools/games_live_smoke.py'
      - 'tools/games_scope_smoke.py'
      - 'tools/overview_live_smoke.py'
      - 'tools/overview_scope_smoke.py'
      - 'tools/ready_room_live_smoke.py'
      - 'tools/ready_room_ui_smoke.py'
      - 'tools/ready_room_scope_smoke.py'
      - 'tools/windows_crimson_ui_smoke.py'
      - '.github/workflows/windows-crimson-preview.yml'
      - 'installer/GameGraveCrimsonPreview.iss'
      - 'installer/Start_Ready_Room_Reference.bat'
      - 'installer/READY_ROOM_BUILD_README.txt'
      - 'installer/OVERVIEW_BUILD_README.txt'

concurrency:
  group: crimson-command-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Render and package Crimson Command on Windows
    runs-on: windows-latest
    env:
      GG_CRIMSON_QA_DISPOSABLE: 'YES'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview and packaging dependencies
        run: python -m pip install -r build-requirements.txt -r ui-preview-requirements.txt
      - name: Create isolated temp folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '_ci_temp' | Out-Null
          $p = (Resolve-Path '_ci_temp').Path
          "TEMP=$p" | Out-File $env:GITHUB_ENV -Append
          "TMP=$p" | Out-File $env:GITHUB_ENV -Append
      - name: Compile new Python modules
        run: python -m compileall -q gg_desktop
      - name: Pure model tests and source UI smoke
        shell: pwsh
        run: |
          python -m unittest tests.test_gg_desktop_models tests.test_ready_room_data tests.test_ready_room_services tests.test_overview_data tests.test_overview_storage tests.test_games_functionality tests.test_mods_functionality tests.test_old_files_functionality -v
          if ($LASTEXITCODE -ne 0) { throw 'Crimson view model safety tests failed.' }
          python tools/windows_crimson_ui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Crimson native Qt UI smoke failed.' }
          python tools/photo_reference_guard.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Owner photos or protected engines changed.' }
          python tools/photo_ui_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Photo-layout functionality or reference geometry failed.' }
          python tools/ready_room_ui_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Ready Room native scale, navigation or controls failed.' }
          python tools/overview_scope_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Ready Room or another locked tab changed while repairing Overview.' }
          python tools/overview_live_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Overview measurements or live controls failed.' }
          python tools/ready_room_live_smoke.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Ready Room live news or verified backup checks failed.' }
          python tools/render_reference_previews.py --output _ci_temp
          if ($LASTEXITCODE -ne 0) { throw 'Native photo comparison renders failed.' }
      - name: Upload actual Qt screen captures for design review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: GameGrave-Crimson-Rendered-UI-Screenshots
          path: |
            _ci_temp/crimson-*-1440.png
            _ci_temp/ready-room-*.png
            _ci_temp/restored-overview.png
            _ci_temp/overview-*.png
            _ci_temp/games-*.png
            _ci_temp/mods-*.png
            _ci_temp/old-files-*.png
            _ci_temp/photo-*.png
            _ci_temp/*-1280.png
            _ci_temp/overview-tab-lock/**/hashes.json
            _ci_temp/overview-measurement.json
          if-no-files-found: error
          retention-days: 14
      - name: Build standalone unsigned Qt EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GameGrave-Crimson-Preview --collect-all PySide6 --add-data "gg_desktop/assets;gg_desktop/assets" gg_desktop/__main__.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt PyInstaller failed.' }
          if (-not (Test-Path 'dist/GameGrave-Crimson-Preview.exe')) { throw 'Missing Qt EXE' }
      - name: Launch packaged Qt EXE with disposable isolated settings profile
        shell: pwsh
        run: |
          $testData = Join-Path (Resolve-Path '_ci_temp').Path 'StandaloneUser'
          New-Item -ItemType Directory -Force $testData | Out-Null
          $env:LOCALAPPDATA = $testData
          $env:APPDATA = $testData
          $binary = (Resolve-Path 'dist/GameGrave-Crimson-Preview.exe').Path
          $p = Start-Process -FilePath $binary -PassThru
          Start-Sleep -Seconds 6
          try {
            if ($p.HasExited) { throw 'Packaged Qt EXE quit immediately.' }
            Write-Host 'Packaged Crimson Qt UI launched without changing game files.'
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          $reference = Start-Process -FilePath $binary -ArgumentList '--ready-room-reference' -PassThru
          Start-Sleep -Seconds 5
          try {
            if ($reference.HasExited) { throw 'Packaged Ready Room reference preview quit immediately.' }
            Write-Host 'Packaged Ready Room reference preview launched.'
          } finally {
            if (-not $reference.HasExited) { Stop-Process -Id $reference.Id -Force }
          }
      - name: Install Inno Setup 6 for distinct preview installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup' }
          }
      - name: Build separate unsigned Crimson installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc /Qp 'installer/GameGraveCrimsonPreview.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Crimson preview installer compilation failed' }
          if (-not (Test-Path 'release/GameGrave-Crimson-Preview-Setup.exe')) { throw 'Preview installer missing' }
          $hash = (Get-FileHash 'release/GameGrave-Crimson-Preview-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'release/GameGrave-Crimson-Preview-Setup.sha256' -Value "$hash  GameGrave-Crimson-Preview-Setup.exe"
          Write-Host 'Built isolated, unsigned preview installer with independently verifiable SHA-256.'
      - name: Test isolated install and uninstall without touching any user settings
        shell: pwsh
        run: |
          $root = (Resolve-Path '_ci_temp').Path
          $local = Join-Path $root 'PreviewUserLocal'
          $installed = Join-Path $local 'CrimsonInstall'
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          $sentinel = Join-Path $local 'sentinel-settings.json'
          Set-Content -Path $sentinel -Value '{"never_touch":["KEEP THIS"]}'
          $setup = (Resolve-Path 'release/GameGrave-Crimson-Preview-Setup.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installed") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw 'Crimson isolated installation failed' }
          $exe = Join-Path $installed 'GameGrave-Crimson-Preview.exe'
          if (-not (Test-Path $exe)) { throw 'Crimson installed EXE missing' }
          $env:LOCALAPPDATA = $local
          $env:APPDATA = $local
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          try {
            if ($p.HasExited) { throw 'Installed Crimson UI exited immediately' }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          $uninstaller = Join-Path $installed 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Preview uninstaller missing' }
          $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
          if ($removed.ExitCode -ne 0) { throw 'Preview uninstaller failed' }
          if (-not (Test-Path $sentinel)) { throw 'Preview uninstall removed unrelated user settings' }
          if ((Get-Content $sentinel -Raw) -notmatch 'KEEP THIS') { throw 'Settings sentinel corrupted' }
          Write-Host 'PASS: unsigned Qt preview installs/launches/uninstalls; personal settings untouched.'
      - name: Assemble Overview Windows download
        shell: pwsh
        run: |
          $taskBundle = Join-Path (Resolve-Path '_ci_temp').Path 'OverviewWindows'
          New-Item -ItemType Directory -Force $taskBundle | Out-Null
          Copy-Item -Path @(
            'dist/GameGrave-Crimson-Preview.exe',
            'release/GameGrave-Crimson-Preview-Setup.exe',
            'installer/OVERVIEW_BUILD_README.txt'
          ) -Destination $taskBundle
          Copy-Item '_ci_temp/overview-functional-1450.png' (Join-Path $taskBundle 'Overview-Preview.png')
          Copy-Item '_ci_temp/overview-functional-1280.png' (Join-Path $taskBundle 'Overview-Preview-1280.png')
          Copy-Item '_ci_temp/overview-functional-960.png' (Join-Path $taskBundle 'Overview-Preview-960.png')
          $checksums = Get-ChildItem $taskBundle -Filter '*.exe' | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          }
          Set-Content (Join-Path $taskBundle 'SHA256SUMS.txt') -Value $checksums -Encoding ascii
          @(
            'Game Grave Overview measured storage Windows preview 0.2.10',
            'Source commit: ${{ github.event.pull_request.head.sha || github.sha }}',
            'Checkout commit: ${{ github.sha }}',
            'Build run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          ) | Set-Content (Join-Path $taskBundle 'Build-Info.txt') -Encoding ascii
      - name: Upload Overview Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GameGrave-Overview-Storage-Windows-Preview
          path: _ci_temp/OverviewWindows/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Crimson screenshot and Windows engineering EXE
        uses: actions/upload-artifact@v4
        with:
          name: GameGrave-Crimson-Qt-Preview-Unsigned
          path: |
            dist/GameGrave-Crimson-Preview.exe
            _ci_temp/crimson-*-1440.png
            _ci_temp/ready-room-*.png
            release/GameGrave-Crimson-Preview-Setup.exe
            release/GameGrave-Crimson-Preview-Setup.sha256
          if-no-files-found: error
          retention-days: 14

# NOT a signed 1.0 release; LGPL/Qt redistributable obligations,
# full UI feature parity, physical Windows human tests and beta remain open.
