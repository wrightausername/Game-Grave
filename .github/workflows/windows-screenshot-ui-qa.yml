name: Screenshot Graveyard native Windows preview QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'screenshots.py'
      - 'screenshot_preview.py'
      - 'graveyard.py'
      - 'ui.py'
      - 'tools/windows_screenshot_ui_smoke.py'
      - '.github/workflows/windows-screenshot-ui-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'screenshots.py'
      - 'screenshot_preview.py'
      - 'graveyard.py'
      - 'ui.py'
      - 'tools/windows_screenshot_ui_smoke.py'
      - '.github/workflows/windows-screenshot-ui-qa.yml'

permissions:
  contents: read

jobs:
  screenshot-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and local image preview dependencies
        run: python -m pip install -r build-requirements.txt
      - name: Render real Tk screenshot preview on disposable Windows fixture
        shell: pwsh
        env:
          GG_SCREENSHOT_QA_DISPOSABLE: 'YES'
        run: |
          New-Item -ItemType Directory -Force "_ci_temp" | Out-Null
          python tools/windows_screenshot_ui_smoke.py
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows in-app screenshot review did not pass'
          }

# A hosted Windows runner is not acceptance of production photo/deletion behavior.
# Never runs Windows Recycle Bin operations on personal files.
