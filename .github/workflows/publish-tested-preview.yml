name: Publish tested Game Grave preview download

on:
  push:
    branches: [delivery/gamegrave-preview-download-20261104]
    paths: ['.github/workflows/publish-tested-preview.yml']

permissions:
  contents: read

concurrency:
  group: publish-preview-e9f1987
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the existing verified installer as a prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '41836698117'
      SOURCE_SHA: e9f1987ea84fb7aca1f58ac9f6b4148c0ac050f9
      PREVIEW_TAG: preview-e9f1987
    steps:
      - name: Verify the exact tested source run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'wrightausername/Game-Grave'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Unexpected installer source'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build was not successful'
          assert run['name'] == 'Crimson Command Qt desktop preview (unsigned)', 'Wrong workflow'
          print('Verified successful Windows UI, DPI, packaging and installer checks.')
          PY
      - name: Download the existing installer without rebuilding it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: wrightausername/Game-Grave
          run-id: '41836698117'
          name: GameGrave-Cinematic-Windows-Installer-Unsigned
          path: original
      - name: Verify and prepare the public download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, shutil, zipfile
          root = pathlib.Path('original')
          installers = list(root.rglob('GameGrave-Crimson-Preview-Setup.exe'))
          assert len(installers) == 1, 'Expected exactly one tested installer'
          original = installers[0]
          expected = original.with_suffix('.sha256').read_text().split()[0].lower()
          actual = hashlib.file_digest(original.open('rb'), 'sha256').hexdigest()
          assert actual == expected, 'Installer checksum mismatch'
          delivery = pathlib.Path('delivery')
          delivery.mkdir()
          installer = delivery / 'GameGrave-Setup-e9f1987.exe'
          shutil.copyfile(original, installer)
          checksum = delivery / 'GameGrave-Setup-e9f1987.sha256'
          checksum.write_text(actual + '  ' + installer.name + '\n')
          readme = delivery / 'README.txt'
          readme.write_text(
              'Game Grave Windows UI preview — build e9f1987\n\n'
              'Close Game Grave, extract this ZIP, and run GameGrave-Setup-e9f1987.exe.\n'
              'Inventory and manual mod scans run with games, overlays and fullscreen apps open.\n'
              'This is an unsigned engineering preview.\n')
          with zipfile.ZipFile(delivery / 'GameGrave-Windows-Preview-e9f1987.zip', 'w',
                               compression=zipfile.ZIP_STORED) as archive:
              for path in (installer, checksum, readme):
                  archive.write(path, path.name)
          print('Verified installer SHA-256:', actual)
          PY
      - name: Publish clearly marked preview assets
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Windows UI preview with game/fullscreen scan pauses removed.

          Inventory and manual mod scans run while games, overlays or fullscreen applications are open. Cancellation and file protections remain active.

          Download the ZIP, extract it, and run the installer. The EXE is also available separately. These public release links require no GitHub sign-in.

          This is an unsigned engineering preview, not a stable 1.0 release or a claim of exact pixel parity. The installer bytes are unchanged from the successful Windows build and install/launch/uninstall tests in run 41836698117. Source commit: e9f1987ea84fb7aca1f58ac9f6b4148c0ac050f9. SHA-256 is included.
          NOTES
          gh release create "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Game Grave Windows UI Preview — e9f1987 (unsigned)' \
            --prerelease --latest=false \
            --notes-file release-notes.md \
            delivery/GameGrave-Windows-Preview-e9f1987.zip \
            delivery/GameGrave-Setup-e9f1987.exe \
            delivery/GameGrave-Setup-e9f1987.sha256
