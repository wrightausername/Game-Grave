name: Publish tested Game Grave preview download

on:
  push:
    branches: [delivery/gamegrave-preview-download-20261104]
    paths: ['.github/workflows/publish-tested-preview.yml']

permissions:
  contents: read

concurrency:
  group: publish-preview-f2d313a
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the existing verified installer as a prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '41931303835'
      SOURCE_SHA: f2d313a838aba3ce0850f4227d143b82f22fcec5
      PREVIEW_TAG: preview-f2d313a
    steps:
      - name: Verify the exact tested source run
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'wrightausername/Game-Grave'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Unexpected installer source'
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build was not successful'
          assert run['name'] == 'Crimson Command Qt desktop preview (unsigned)', 'Wrong workflow'
          print('Verified successful Windows UI, DPI, packaging and installer checks.')
          PY
      - name: Download the existing installer without rebuilding it
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: wrightausername/Game-Grave
          run-id: '41931303835'
          name: GameGrave-Cinematic-Windows-Installer-Unsigned
          path: original
      - name: Download actual native UI captures
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: wrightausername/Game-Grave
          run-id: '41931303835'
          name: GameGrave-Crimson-Rendered-UI-Screenshots
          path: visual-review
      - name: Verify and prepare the public download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, zipfile
          root = pathlib.Path('original')
          installers = list(root.rglob('GameGrave-Crimson-Preview-Setup.exe'))
          assert len(installers) == 1, 'Expected exactly one tested installer'
          original = installers[0]
          expected = original.with_suffix('.sha256').read_text().split()[0].lower()
          actual = hashlib.file_digest(original.open('rb'), 'sha256').hexdigest()
          assert actual == expected, 'Installer checksum mismatch'
          delivery = pathlib.Path('delivery')
          delivery.mkdir()
          installer = delivery / 'GameGrave-Setup-f2d313a.exe'
          shutil.copyfile(original, installer)
          checksum = delivery / 'GameGrave-Setup-f2d313a.sha256'
          checksum.write_text(actual + '  ' + installer.name + '\n')
          readme = delivery / 'README.txt'
          readme.write_text(
              'Game Grave Windows UI preview — build f2d313a\n\n'
              'Close Game Grave, extract this ZIP, and run GameGrave-Setup-f2d313a.exe.\n'
              'After installation, launch Game Grave Crimson Preview from the Start menu.\n'
              'Updated interiors and context panels; expanded left/right Captures workspace.\n'
              'Inventory and manual mod scans run with games, overlays and fullscreen apps open.\n'
              'This is an unsigned engineering preview.\n')
          with zipfile.ZipFile(delivery / 'GameGrave-Windows-Preview-f2d313a.zip', 'w',
                               compression=zipfile.ZIP_STORED) as archive:
              for path in (installer, checksum, readme):
                  archive.write(path, path.name)
          screenshots = list(pathlib.Path('visual-review').rglob('visual-review-captures-1672.png'))
          assert len(screenshots) == 1, 'Expected the actual native Captures screenshot'
          shots = screenshots[0].parent
          pages = sorted(shots.glob('visual-review-*.png'))
          assert len(pages) == 26, 'Expected all 13 pages at two native Windows sizes'
          provenance = shots / 'visual-review.json'
          assert provenance.is_file(), 'Missing native capture provenance'
          manifest = json.loads(provenance.read_text())
          assert manifest['platform'] == 'win32', 'Screenshots are not native Windows captures'
          hashes = {page.name: hashlib.file_digest(page.open('rb'), 'sha256').hexdigest()
                    for page in pages}
          review = delivery / 'UI-source-and-hashes.json'
          review.write_text(json.dumps({'source_head': os.environ['SOURCE_SHA'],
              'windows_workflow_run': os.environ['SOURCE_RUN'],
              'native_capture_commit': manifest['commit'], 'sha256': hashes}, indent=2))
          with zipfile.ZipFile(delivery / 'GameGrave-UI-Screenshots-f2d313a.zip', 'w',
                               compression=zipfile.ZIP_DEFLATED) as archive:
              for page in pages + [provenance, review]:
                  archive.write(page, page.name)
          for page in pages:
              if page.stem.endswith('-1672'):
                  slug = page.stem.removeprefix('visual-review-').removesuffix('-1672')
                  title = '-'.join(part.upper() if part in ('ai', 'dna') else part.title()
                                   for part in slug.split('-'))
                  shutil.copyfile(page, delivery / (title + '-preview.png'))
          print('Verified installer SHA-256:', actual)
          PY
      - name: Publish clearly marked preview assets
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          Windows UI preview with revised interiors and contextual side panels across the locked pages.

          Graveyard now keeps item actions visible below scrollable evidence, and its table adapts so review status stays visible. Game DNA and Undo Center have aligned selected-item facts, source details and compact actions. AI Assistant uses the locked workflow/conversation/context proportions. Settings retains its seven sections and multi-column control center. More Tools has compact recent-use records and recovery links. Games and Mods use the same restrained context panels.

          The shared stylesheet now uses consistent charcoal surfaces, subtle borders, compact controls and red action states. The original approved photo family remains throughout all 13 pages. Missing artwork does not occupy a large inspector placeholder. Overview has one aligned library header.

          Captures keeps the screenshot browser on the left and a larger, expanding selected-image preview on the right. Inventory and manual mod scans continue while games, overlays and fullscreen apps are open.

          ![Actual native Windows Graveyard](https://github.com/wrightausername/Game-Grave/releases/download/preview-f2d313a/Graveyard-preview.png)

          ![Actual native Windows Game DNA](https://github.com/wrightausername/Game-Grave/releases/download/preview-f2d313a/Game-DNA-preview.png)

          ![Actual native Windows AI Assistant](https://github.com/wrightausername/Game-Grave/releases/download/preview-f2d313a/AI-Assistant-preview.png)

          ![Actual native Windows Settings](https://github.com/wrightausername/Game-Grave/releases/download/preview-f2d313a/Settings-preview.png)

          The screenshots use explicit disposable review fixtures, including synthetic game/mod/recovery records and a synthetic conversation; no user data or AI inference is involved. Game artwork appears only when verified locally or supplied by the owner. The screenshot ZIP contains actual native Windows captures of all 13 pages at 1672×941 and 1366×768, with source provenance and hashes.

          Download **GameGrave-Windows-Preview-f2d313a.zip**, extract it, and run the installer. After installation, launch **Game Grave Crimson Preview** from the Start menu. The EXE is also available separately. Public release downloads require no GitHub sign-in.

          Validation: 522 local tests, 3 platform-specific skips, including 13 Qt interaction/layout regressions; native Windows source UI, 125%/150% DPI, packaged EXE launch, and installer install/launch/uninstall checks. The installer is the unchanged tested artifact from run 41931303835. Source head: f2d313a838aba3ce0850f4227d143b82f22fcec5. SHA-256 is included.

          This is an unsigned engineering preview, not a stable 1.0 release or a declaration of pixel-identical visual acceptance.
          NOTES
          gh release create "$PREVIEW_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'Game Grave Windows UI Preview — f2d313a (unsigned)' \
            --prerelease --latest=false \
            --notes-file release-notes.md \
            delivery/GameGrave-Windows-Preview-f2d313a.zip \
            delivery/GameGrave-Setup-f2d313a.exe \
            delivery/GameGrave-Setup-f2d313a.sha256 \
            delivery/GameGrave-UI-Screenshots-f2d313a.zip \
            delivery/*-preview.png
